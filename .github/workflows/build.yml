name: Cross-Platform Build

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM via Homebrew
        run: brew install llvm cmake
      - name: Build
        run: ./build-cross-platform.sh -c -t Release
      - name: Rename lib
        run: mv build/codequality/libcodequality.dylib build/codequality/libcodequality-macos.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-lib
          path: build/codequality/libcodequality-macos.dylib

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y 'llvm-*' 'clang-*' lldb-* lld-* libc++* libc++abi* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo apt-get install -y cmake build-essential wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all
      - name: Build
        run: ./build-cross-platform.sh -c -t Release
      - name: Rename lib
        run: mv build/codequality/libcodequality.so build/codequality/libcodequality-20.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux-lib
          path: build/codequality/libcodequality-20.so

  release:
    name: Create Release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f ! -name "*.sha256" -exec sh -c '
            for f; do
              openssl dgst -sha256 "$f" > "$f.sha256"
            done
          ' sh {} +

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
